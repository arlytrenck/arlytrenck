<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Arly Trenck, IT Operations Manager. Do it once by hand. Every time after, script it.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121211"/>
      <stop offset="1" stop-color="#1C1B1A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2B2A28" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="720" width="480" height="320" fill="url(#grid)" opacity="0.6"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="92" fill="#DDBB6A" font-size="15" font-weight="600" letter-spacing="3.5">IT OPERATIONS MANAGER</text>
    <text x="70" y="172" fill="#F4F3EF" font-size="72" font-weight="700" letter-spacing="-1.5">Arly Trenck</text>
    <line x1="72" y1="222" x2="112" y2="222" stroke="#DDBB6A" stroke-width="2"/>
    <text x="128" y="229" fill="#F4F3EF" font-size="22" font-weight="600">Do it once by hand.</text>
    <text x="128" y="261" fill="#DDBB6A" font-size="22" font-style="italic">Every time after, script it.</text>
    <text x="72" y="300" fill="#C9C5BF" font-size="13" font-weight="600" letter-spacing="2.5">TRENCK.NET</text>
    <g fill="#C9C5BF" font-size="13" font-weight="600" letter-spacing="2.5" text-anchor="end">
      <text x="1128" y="92">29 OFFICES</text>
      <text x="1128" y="118">1,250+ USERS</text>
      <text x="1128" y="144">3 STATES</text>
    </g>
  </g>
  <rect y="316" width="1200" height="4" fill="#DDBB6A"/>
</svg>
